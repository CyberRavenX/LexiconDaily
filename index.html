<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Daily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Custom scrollbar for sleek look */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen pb-24 selection:bg-purple-500 selection:text-white">

    <!-- App Header -->
    <header class="sticky top-0 z-50 bg-[#09090b]/80 backdrop-blur-xl border-b border-zinc-800/80 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight text-purple-400">Lexicon</span>
            <span class="text-xs bg-purple-500/10 text-purple-300 border border-purple-500/20 px-2 py-0.5 rounded-full font-medium">Daily</span>
        </div>
        <div class="flex items-center space-x-2 text-sm">
            <div class="flex items-center space-x-1 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full text-purple-400 font-semibold shadow-inner">
                🔥 <span id="streakCount">1</span>d
            </div>
            <button onclick="switchTab('home')" id="navHome" class="px-3 py-1.5 rounded-lg bg-purple-600 text-white font-medium transition shadow-lg shadow-purple-600/20">Today</button>
            <button onclick="switchTab('quiz')" id="navQuiz" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">Quiz</button>
            <button onclick="switchTab('saved')" id="navSaved" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">Saved</button>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="max-w-md mx-auto p-4 mt-2">

        <!-- TODAY / MAIN TAB -->
        <div id="tabHome" class="space-y-4">
            <!-- Word Card -->
            <div class="bg-gradient-to-b from-zinc-900 to-[#121216] border border-zinc-800/80 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-36 h-36 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start mb-3 relative z-10">
                    <div>
                        <span id="wordCategory" class="text-xs uppercase tracking-wider text-purple-400 font-semibold bg-purple-500/10 border border-purple-500/20 px-2.5 py-1 rounded-md">Literary</span>
                        <h1 id="wordTitle" class="text-3xl font-extrabold tracking-tight mt-2 text-white">Ephemeral</h1>
                    </div>
                    <button onclick="toggleSave()" id="saveBtn" class="bg-zinc-800/80 border border-zinc-700/50 hover:border-purple-500/50 p-2.5 rounded-xl text-lg transition shadow-md">
                        🤍
                    </button>
                </div>

                <div class="flex items-center space-x-2 text-zinc-400 text-sm mb-4 relative z-10">
                    <span id="wordPhonetic" class="font-mono text-zinc-400">/ɪˈfɛm.ər.əl/</span>
                    <button onclick="speakWord()" class="bg-zinc-800 hover:bg-zinc-700 text-purple-300 px-2.5 py-1 rounded-full text-xs transition border border-zinc-700/50 flex items-center space-x-1">
                        <span>🔊 Listen</span>
                    </button>
                </div>

                <div class="space-y-3 border-t border-zinc-800/80 pt-4 relative z-10">
                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Definition</span>
                        <p id="wordDefinition" class="text-zinc-200 text-sm mt-0.5 leading-relaxed">Lasting for a very short time; transient.</p>
                    </div>

                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Example</span>
                        <p id="wordExample" class="text-zinc-300 text-sm italic mt-0.5 bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/60">"Fame is ephemeral; character is lasting."</p>
                    </div>

                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Synonyms</span>
                        <div id="wordSynonyms" class="flex flex-wrap gap-1.5 mt-1.5"></div>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadNewWord()" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 hover:border-zinc-700 text-zinc-200 py-3 rounded-xl font-medium text-sm transition flex items-center justify-center space-x-2 shadow-lg">
                    <span>🔄 Next Word</span>
                </button>
                <button onclick="shareWord()" class="bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl font-medium text-sm transition flex items-center justify-center space-x-2 shadow-lg shadow-purple-600/25">
                    <span>📤 Share Word</span>
                </button>
            </div>
        </div>

        <!-- QUIZ TAB -->
        <div id="tabQuiz" class="hidden space-y-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-white">Daily Vocabulary Check</h2>
                    <span id="quizProgress" class="text-xs text-purple-400 font-semibold bg-purple-500/10 px-2.5 py-1 rounded-md">Question 1/3</span>
                </div>
                
                <p id="quizQuestion" class="text-zinc-200 font-medium text-sm mb-4">What is the definition of "Ephemeral"?</p>
                
                <div id="quizOptions" class="space-y-2.5">
                    <!-- Dynamically populated options -->
                </div>

                <div id="quizFeedback" class="mt-4 hidden p-3 rounded-xl text-sm font-medium text-center"></div>
            </div>
            
            <button onclick="initQuiz()" id="nextQuizBtn" class="hidden w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl font-medium text-sm transition shadow-lg shadow-purple-600/25">
                Next Question ➡️
            </button>
        </div>

        <!-- SAVED WORDS TAB -->
        <div id="tabSaved" class="hidden space-y-3">
            <h2 class="text-lg font-bold text-white mb-2">Saved Vocabulary</h2>
            <div id="savedList" class="space-y-2.5"></div>
        </div>

    </main>

    <script>
        // Expanded vocabulary database (ready for scaling)
        const words = [
            {
                word: "Ephemeral",
                phonetic: "/ɪˈfɛm.ər.əl/",
                category: "Literary",
                definition: "Lasting for a very short time; transient.",
                example: "\"Fame is ephemeral; true character is lasting.\"",
                synonyms: ["Fleeting", "Transient", "Evanescent"]
            },
            {
                word: "Serendipity",
                phonetic: "/ˌsɛr.ənˈdɪp.ə.ti/",
                category: "Advanced",
                definition: "The occurrence of events by chance in a happy or beneficial way.",
                example: "\"Finding my favorite book at the thrift store was pure serendipity.\"",
                synonyms: ["Fluke", "Providence", "Blessing"]
            },
            {
                word: "Mellifluous",
                phonetic: "/məˈlɪf.lu.əs/",
                category: "Articulate",
                definition: "(Of a voice or words) sweet or musical; pleasant to hear.",
                example: "\"She spoke with a mellifluous voice that instantly calmed the room.\"",
                synonyms: ["Melodic", "Harmonious", "Silvery"]
            },
            {
                word: "Petrichor",
                phonetic: "/ˈpɛt.rɪ.kɔːr/",
                category: "Nature",
                definition: "A pleasant smell that frequently accompanies the first rain after a long period of warm, dry weather.",
                example: "\"The heavy petrichor filled the air right before the storm broke.\"",
                synonyms: ["Earth scent", "Rain aroma"]
            },
            {
                word: "Resilient",
                phonetic: "/rɪˈzɪl.jənt/",
                category: "Workplace",
                definition: "Able to withstand or recover quickly from difficult conditions.",
                example: "\"Entrepreneurs need to be resilient when facing unexpected hurdles.\"",
                synonyms: ["Tough", "Hardy", "Adaptable"]
            },
            {
                word: "Sycophant",
                phonetic: "/ˈsɪk.ə.fənt/",
                category: "Advanced",
                definition: "A person who acts obsequiously toward someone important in order to gain advantage.",
                example: "\"He surrounded himself with sycophants who praised every idea he had.\"",
                synonyms: ["Flatterer", "Yes-man", "Parasite"]
            },
            {
                word: "Nadir",
                phonetic: "/ˈneɪ.dɪər/",
                category: "Literary",
                definition: "The lowest point in the fortunes of a person or organization.",
                example: "\"Entering the bear market was the nadir of his trading career.\"",
                synonyms: ["Low point", "Bottom", "Rock bottom"]
            },
            {
                word: "Ineffable",
                phonetic: "/ɪnˈɛf.ə.bəl/",
                category: "Articulate",
                definition: "Too great or extreme to be expressed or described in words.",
                example: "\"Standing before the grand mountain range, she felt an ineffable peace.\"",
                synonyms: ["Indescribable", "Unspeakable", "Transcendent"]
            }
        ];

        let currentIndex = 0;
        let savedWords = JSON.parse(localStorage.getItem('lexicon_saved')) || [];
        let streak = parseInt(localStorage.getItem('lexicon_streak')) || 1;

        document.getElementById('streakCount').innerText = streak;

        function displayWord(index) {
            const w = words[index];
            document.getElementById('wordTitle').innerText = w.word;
            document.getElementById('wordPhonetic').innerText = w.phonetic;
            document.getElementById('wordCategory').innerText = w.category;
            document.getElementById('wordDefinition').innerText = w.definition;
            document.getElementById('wordExample').innerText = w.example;
            
            const synContainer = document.getElementById('wordSynonyms');
            synContainer.innerHTML = w.synonyms.map(s => `<span class="text-xs bg-zinc-800/80 border border-zinc-700/50 text-zinc-300 px-2 py-0.5 rounded-md">${s}</span>`).join('');

            updateSaveButtonState();
        }

        function loadNewWord() {
            currentIndex = (currentIndex + 1) % words.length;
            displayWord(currentIndex);
        }

        function speakWord() {
            const w = words[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(w);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSave() {
            const w = words[currentIndex];
            const existsIndex = savedWords.findIndex(item => item.word === w.word);
            
            if (existsIndex > -1) {
                savedWords.splice(existsIndex, 1);
            } else {
                savedWords.push(w);
            }
            
            localStorage.setItem('lexicon_saved', JSON.stringify(savedWords));
            updateSaveButtonState();
            renderSavedList();
        }

        function updateSaveButtonState() {
            const w = words[currentIndex];
            const isSaved = savedWords.some(item => item.word === w.word);
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = isSaved ? '❤️' : '🤍';
        }

        function renderSavedList() {
            const list = document.getElementById('savedList');
            if (savedWords.length === 0) {
                list.innerHTML = `<p class="text-zinc-500 text-sm text-center py-12">No saved words yet.<br>Tap the heart icon on any word to build your bank!</p>`;
                return;
            }
            list.innerHTML = savedWords.map(w => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center shadow-md">
                    <div>
                        <h3 class="font-bold text-white text-sm">${w.word} <span class="text-xs font-normal text-purple-400 ml-1">${w.phonetic}</span></h3>
                        <p class="text-xs text-zinc-400 mt-1">${w.definition}</p>
                    </div>
                </div>
            `).join('');
        }

        function shareWord() {
            const w = words[currentIndex];
            const text = `Word of the Day: *${w.word}* (${w.phonetic})\nDefinition: ${w.definition}\nExample: ${w.example}`;
            if (navigator.share) {
                navigator.share({ title: 'Lexicon Daily', text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Word copied to clipboard!');
            }
        }

        function switchTab(tab) {
            const homeTab = document.getElementById('tabHome');
            const quizTab = document.getElementById('tabQuiz');
            const savedTab = document.getElementById('tabSaved');
            
            const navHome = document.getElementById('navHome');
            const navQuiz = document.getElementById('navQuiz');
            const navSaved = document.getElementById('navSaved');

            // Reset all tabs & nav styles
            homeTab.classList.add('hidden');
            quizTab.classList.add('hidden');
            savedTab.classList.add('hidden');
            
            navHome.className = "px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition";
            navQuiz.className = "px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition";
            navSaved.className = "px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition";

            if (tab === 'home') {
                homeTab.classList.remove('hidden');
                navHome.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white font-medium transition shadow-lg shadow-purple-600/20";
            } else if (tab === 'quiz') {
                quizTab.classList.remove('hidden');
                navQuiz.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white font-medium transition shadow-lg shadow-purple-600/20";
                initQuiz();
            } else {
                savedTab.classList.remove('hidden');
                navSaved.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white font-medium transition shadow-lg shadow-purple-600/20";
                renderSavedList();
            }
        }

        // Simple interactive quiz engine
        let currentQuizIndex = 0;
        function initQuiz() {
            const qObj = words[currentQuizIndex % words.length];
            document.getElementById('quizProgress').innerText = `Question ${(currentQuizIndex % words.length) + 1}/${words.length}`;
            document.getElementById('quizQuestion').innerText = `What does "${qObj.word}" mean?`;
            
            // Generate options (1 correct + 3 random incorrect)
            let options = [qObj.definition];
            while(options.length < 4) {
                let randomDef = words[Math.floor(Math.random() * words.length)].definition;
                if(!options.includes(randomDef)) options.push(randomDef);
            }
            options.sort(() => Math.random() - 0.5);

            const optContainer = document.getElementById('quizOptions');
            optContainer.innerHTML = '';
            document.getElementById('quizFeedback').classList.add('hidden');
            document.getElementById('nextQuizBtn').classList.add('hidden');

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-zinc-950/80 border border-zinc-800 hover:border-purple-500/50 p-3 rounded-xl text-xs text-zinc-300 transition shadow-inner";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, qObj.definition, btn);
                optContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btnElement) {
            const feedback = document.getElementById('quizFeedback');
            feedback.classList.remove('hidden');
            
            if(selected === correct) {
                btnElement.className = "w-full text-left bg-purple-950/40 border border-purple-500 p-3 rounded-xl text-xs text-purple-200 shadow-md";
                feedback.innerText = "✨ Correct! Spot on.";
                feedback.className = "mt-4 p-3 rounded-xl text-sm font-medium text-center bg-purple-500/10 text-purple-300 border border-purple-500/20";
            } else {
                btnElement.className = "w-full text-left bg-red-950/40 border border-red-500/50 p-3 rounded-xl text-xs text-red-200 shadow-md";
                feedback.innerText = `❌ Not quite. The correct definition is: "${correct}"`;
                feedback.className = "mt-4 p-3 rounded-xl text-sm font-medium text-center bg-red-500/10 text-red-300 border border-red-500/20";
            }
            
            document.getElementById('nextQuizBtn').classList.remove('hidden');
            currentQuizIndex++;
        }

        document.getElementById('nextQuizBtn').onclick = initQuiz;

        // Initialize App
        displayWord(currentIndex);
    </script>
</body>
</html>
