<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Daily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen pb-24 selection:bg-purple-500 selection:text-white">

    <!-- App Header -->
    <header class="sticky top-0 z-50 bg-[#09090b]/80 backdrop-blur-xl border-b border-zinc-800/80 px-4 py-3.5 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-extrabold tracking-tight text-purple-400">Lexicon</span>
            <span class="text-[10px] bg-purple-500/10 text-purple-300 border border-purple-500/20 px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">Daily</span>
        </div>
        <div class="flex items-center space-x-2 text-sm">
            <div class="flex items-center space-x-1 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full text-purple-400 font-semibold shadow-inner text-xs">
                🔥 <span id="streakCount">1</span>d
            </div>
            <button onclick="switchTab('home')" id="navHome" class="px-3 py-1.5 rounded-lg bg-purple-600 text-white font-medium text-xs transition shadow-lg shadow-purple-600/20">Today</button>
            <button onclick="switchTab('quiz')" id="navQuiz" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white text-xs transition">Quiz</button>
            <button onclick="switchTab('saved')" id="navSaved" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white text-xs transition">Saved</button>
        </div>
    </header>

    <!-- Main Mobile Container -->
    <main class="max-w-md mx-auto p-4 mt-2">

        <!-- TODAY TAB -->
        <div id="tabHome" class="space-y-4">
            <!-- Word Display Card -->
            <div class="bg-gradient-to-b from-zinc-900 to-[#121216] border border-zinc-800/90 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-36 h-36 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start mb-3 relative z-10">
                    <div>
                        <span id="wordCategory" class="text-[10px] uppercase tracking-widest text-purple-400 font-bold bg-purple-500/10 border border-purple-500/20 px-2.5 py-1 rounded-md">Literary</span>
                        <h1 id="wordTitle" class="text-3xl font-extrabold tracking-tight mt-2.5 text-white">Ephemeral</h1>
                    </div>
                    <button onclick="toggleSave()" id="saveBtn" class="bg-zinc-800/80 border border-zinc-700/50 hover:border-purple-500/50 p-2.5 rounded-xl text-lg transition shadow-md">
                        🤍
                    </button>
                </div>

                <div class="flex items-center space-x-2 text-zinc-400 text-sm mb-4 relative z-10">
                    <span id="wordPhonetic" class="font-mono text-zinc-400 text-xs">/ɪˈfɛm.ər.əl/</span>
                    <button onclick="speakWord()" class="bg-zinc-800/80 hover:bg-zinc-700 text-purple-300 px-2.5 py-1 rounded-full text-[11px] transition border border-zinc-700/50 flex items-center space-x-1 font-medium">
                        <span>🔊 Listen</span>
                    </button>
                </div>

                <div class="space-y-3 border-t border-zinc-800/80 pt-4 relative z-10">
                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Definition</span>
                        <p id="wordDefinition" class="text-zinc-200 text-sm mt-1 leading-relaxed">Lasting for a very short time; transient.</p>
                    </div>

                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Example</span>
                        <p id="wordExample" class="text-zinc-300 text-xs italic mt-1 bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/60 leading-relaxed">"Fame is ephemeral; true character is lasting."</p>
                    </div>

                    <div>
                        <span class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Synonyms</span>
                        <div id="wordSynonyms" class="flex flex-wrap gap-1.5 mt-1.5"></div>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadRandomWord()" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 hover:border-zinc-700 text-zinc-200 py-3 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 shadow-lg">
                    <span>🔄 Next Word</span>
                </button>
                <button onclick="shareWord()" class="bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 shadow-lg shadow-purple-600/25 font-semibold">
                    <span>📤 Share Word</span>
                </button>
            </div>
        </div>

        <!-- QUIZ TAB -->
        <div id="tabQuiz" class="hidden space-y-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-white">Interactive Vocabulary Check</h2>
                    <span id="quizScore" class="text-xs text-purple-400 font-semibold bg-purple-500/10 px-2.5 py-1 rounded-md">Score: 0</span>
                </div>
                
                <p id="quizQuestion" class="text-zinc-200 font-medium text-sm mb-4">What is the definition of this word?</p>
                
                <div id="quizOptions" class="space-y-2.5">
                    <!-- Options injected dynamically -->
                </div>

                <div id="quizFeedback" class="mt-4 hidden p-3 rounded-xl text-xs font-medium text-center"></div>
            </div>
            <button onclick="loadQuiz()" id="nextQuizBtn" class="hidden w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl font-medium text-xs transition shadow-lg shadow-purple-600/25">
                Next Question ➡️
            </button>
        </div>

        <!-- SAVED WORDS TAB -->
        <div id="tabSaved" class="hidden space-y-3">
            <h2 class="text-base font-bold text-white mb-2">Saved Vocabulary</h2>
            <div id="savedList" class="space-y-2.5"></div>
        </div>

    </main>
