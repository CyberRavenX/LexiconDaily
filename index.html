<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Daily — Airbnb Dark Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        airbnb: {
                            rausch: '#FF385C',
                            darkBg: '#0B0B0B',
                            cardBg: '#161618',
                            border: '#2F2F35',
                            muted: '#A1A1AA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0B0B; color: #F4F4F5; font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0B0B0B] text-zinc-100 min-h-screen pb-28 antialiased selection:bg-[#FF385C] selection:text-white">

    <!-- Sticky Airbnb Navigation Bar -->
    <header class="sticky top-0 z-50 bg-[#0B0B0B]/90 backdrop-blur-md border-b border-[#2F2F35] px-4 py-3.5">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <!-- App Branding -->
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-[#FF385C] flex items-center justify-center text-white font-black text-sm shadow-lg shadow-[#FF385C]/20">
                    L
                </div>
                <div>
                    <span class="text-base font-extrabold tracking-tight text-white block leading-none">Lexicon</span>
                    <span class="text-[10px] text-zinc-400 font-medium tracking-wide">Airbnb Dark Edition</span>
                </div>
            </div>

            <!-- Streak & Tab Switcher Pill -->
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-1 bg-[#161618] border border-[#2F2F35] px-2.5 py-1 rounded-full text-xs font-semibold text-zinc-200">
                    <span>🔥</span>
                    <span id="streakCount" class="text-white">1</span>d
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4 mt-1">

        <!-- TODAY TAB -->
        <div id="tabHome" class="space-y-4">
            
            <!-- Category Filter Chips (Airbnb Style) -->
            <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">
                <button onclick="filterCategory('All')" class="category-chip active px-3.5 py-1.5 rounded-full border border-[#FF385C] bg-[#FF385C] text-white font-medium whitespace-nowrap transition">All Words</button>
                <button onclick="filterCategory('Literary')" class="category-chip px-3.5 py-1.5 rounded-full border border-[#2F2F35] bg-[#161618] text-zinc-400 hover:text-white font-medium whitespace-nowrap transition">Literary</button>
                <button onclick="filterCategory('Advanced')" class="category-chip px-3.5 py-1.5 rounded-full border border-[#2F2F35] bg-[#161618] text-zinc-400 hover:text-white font-medium whitespace-nowrap transition">Advanced</button>
                <button onclick="filterCategory('Articulate')" class="category-chip px-3.5 py-1.5 rounded-full border border-[#2F2F35] bg-[#161618] text-zinc-400 hover:text-white font-medium whitespace-nowrap transition">Articulate</button>
                <button onclick="filterCategory('Workplace')" class="category-chip px-3.5 py-1.5 rounded-full border border-[#2F2F35] bg-[#161618] text-zinc-400 hover:text-white font-medium whitespace-nowrap transition">Workplace</button>
            </div>

            <!-- Modern Airbnb Listing Card -->
            <div class="bg-[#161618] border border-[#2F2F35] rounded-3xl p-6 shadow-2xl relative overflow-hidden space-y-5">
                
                <div class="flex justify-between items-start">
                    <div>
                        <span id="wordCategory" class="text-[10px] font-bold uppercase tracking-widest text-[#FF385C] bg-[#FF385C]/10 border border-[#FF385C]/20 px-2.5 py-1 rounded-md">Literary</span>
                        <h1 id="wordTitle" class="text-3xl font-extrabold tracking-tight mt-2.5 text-white">Ephemeral</h1>
                    </div>
                    <button onclick="toggleSave()" id="saveBtn" class="w-10 h-10 rounded-full bg-[#0B0B0B] border border-[#2F2F35] flex items-center justify-center text-base hover:border-[#FF385C]/50 transition shadow-inner">
                        🤍
                    </button>
                </div>

                <!-- Phonetics & Speech -->
                <div class="flex items-center space-x-3 pt-1">
                    <span id="wordPhonetic" class="font-mono text-xs text-zinc-400">/ɪˈfɛm.ər.əl/</span>
                    <button onclick="speakWord()" class="bg-[#0B0B0B] hover:bg-zinc-800 text-[#FF385C] px-3 py-1 rounded-full text-xs font-semibold transition border border-[#2F2F35] flex items-center space-x-1.5">
                        <span>🔊 Listen</span>
                    </button>
                </div>

                <!-- Definition & Examples Section -->
                <div class="space-y-4 border-t border-[#2F2F35] pt-4">
                    <div>
                        <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest block mb-1">Definition</span>
                        <p id="wordDefinition" class="text-sm text-zinc-200 leading-relaxed font-normal">Lasting for a very short time; transient.</p>
                    </div>

                    <div>
                        <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest block mb-1">In Context</span>
                        <p id="wordExample" class="text-xs text-zinc-300 italic bg-[#0B0B0B] p-3.5 rounded-2xl border border-[#2F2F35] leading-relaxed">"Fame is ephemeral; true character is lasting."</p>
                    </div>

                    <div>
                        <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest block mb-1.5">Synonyms</span>
                        <div id="wordSynonyms" class="flex flex-wrap gap-1.5"></div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadRandomWord()" class="bg-[#161618] border border-[#2F2F35] hover:bg-zinc-800 text-zinc-200 py-3.5 rounded-2xl font-semibold text-xs transition flex items-center justify-center space-x-2 shadow-lg">
                    <span>🔄 Next Word</span>
                </button>
                <button onclick="shareWord()" class="bg-[#FF385C] hover:bg-[#e03150] text-white py-3.5 rounded-2xl font-semibold text-xs transition flex items-center justify-center space-x-2 shadow-lg shadow-[#FF385C]/20">
                    <span>📤 Share Word</span>
                </button>
            </div>
        </div>

        <!-- QUIZ TAB -->
        <div id="tabQuiz" class="hidden space-y-4">
            <div class="bg-[#161618] border border-[#2F2F35] rounded-3xl p-6 shadow-2xl space-y-4">
                <div class="flex justify-between items-center border-b border-[#2F2F35] pb-3">
                    <h2 class="text-sm font-bold text-white">Interactive Vocabulary Quiz</h2>
                    <span id="quizScore" class="text-xs text-[#FF385C] font-semibold bg-[#FF385C]/10 border border-[#FF385C]/20 px-2.5 py-1 rounded-full">Score: 0</span>
                </div>
                
                <p id="quizQuestion" class="text-sm text-zinc-200 font-medium">What is the definition of this word?</p>
                
                <div id="quizOptions" class="space-y-2.5"></div>

                <div id="quizFeedback" class="hidden p-3 rounded-2xl text-xs font-semibold text-center"></div>
