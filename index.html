<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Daily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-20">

    <!-- App Header -->
    <header class="sticky top-0 z-50 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight text-indigo-400">Lexicon</span>
            <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-medium">Daily</span>
        </div>
        <div class="flex items-center space-x-3 text-sm">
            <div class="flex items-center space-x-1 bg-zinc-800 px-2.5 py-1 rounded-full text-amber-400 font-semibold">
                🔥 <span id="streakCount">1</span>d
            </div>
            <button onclick="switchTab('home')" id="navHome" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition">Today</button>
            <button onclick="switchTab('saved')" id="navSaved" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">Saved</button>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="max-w-md mx-auto p-4 mt-2">

        <!-- TODAY / MAIN TAB -->
        <div id="tabHome" class="space-y-4">
            <!-- Word Card -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span id="wordCategory" class="text-xs uppercase tracking-wider text-indigo-400 font-semibold bg-indigo-500/10 px-2.5 py-1 rounded-md">Literary</span>
                        <h1 id="wordTitle" class="text-3xl font-bold tracking-tight mt-2 text-white">Ephemeral</h1>
                    </div>
                    <button onclick="toggleSave()" id="saveBtn" class="text-zinc-400 hover:text-amber-400 p-2 text-xl transition">
                        🤍
                    </button>
                </div>

                <div class="flex items-center space-x-2 text-zinc-400 text-sm mb-4">
                    <span id="wordPhonetic">/ɪˈfɛm.ər.əl/</span>
                    <button onclick="speakWord()" class="bg-zinc-800 hover:bg-zinc-700 text-indigo-300 p-1.5 rounded-full text-xs transition">
                        🔊 Listen
                    </button>
                </div>

                <div class="space-y-3 border-t border-zinc-800/80 pt-4">
                    <div>
                        <span class="text-xs text-zinc-500 uppercase font-semibold">Definition</span>
                        <p id="wordDefinition" class="text-zinc-200 text-sm mt-0.5">Lasting for a very short time; transient.</p>
                    </div>

                    <div>
                        <span class="text-xs text-zinc-500 uppercase font-semibold">Example</span>
                        <p id="wordExample" class="text-zinc-300 text-sm italic mt-0.5 bg-zinc-950/50 p-2.5 rounded-lg border border-zinc-800/50">"Fame is ephemeral; character is lasting."</p>
                    </div>

                    <div>
                        <span class="text-xs text-zinc-500 uppercase font-semibold">Synonyms</span>
                        <div id="wordSynonyms" class="flex flex-wrap gap-1.5 mt-1"></div>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadNewWord()" class="bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 py-3 rounded-xl font-medium text-sm transition flex items-center justify-center space-x-2">
                    <span>🔄 Next Word</span>
                </button>
                <button onclick="shareWord()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-medium text-sm transition flex items-center justify-center space-x-2">
                    <span>📤 Share Word</span>
                </button>
            </div>
        </div>

        <!-- SAVED WORDS TAB -->
        <div id="tabSaved" class="hidden space-y-3">
            <h2 class="text-lg font-bold text-white mb-2">Saved Vocabulary</h2>
            <div id="savedList" class="space-y-2"></div>
        </div>

    </main>

    <script>
        const words = [
            {
                word: "Ephemeral",
                phonetic: "/ɪˈfɛm.ər.əl/",
                category: "Literary",
                definition: "Lasting for a very short time; transient.",
                example: "\"Fame is ephemeral; true character is lasting.\"",
                synonyms: ["Fleeting", "Transient", "Evanescent"]
            },
            {
                word: "Serendipity",
                phonetic: "/ˌsɛr.ənˈdɪp.ə.ti/",
                category: "Advanced",
                definition: "The occurrence of events by chance in a happy or beneficial way.",
                example: "\"Finding my favorite book at the thrift store was pure serendipity.\"",
                synonyms: ["Fluke", "Providence", "Blessing"]
            },
            {
                word: "Mellifluous",
                phonetic: "/məˈlɪf.lu.əs/",
                category: "Articulate",
                definition: "(Of a voice or words) sweet or musical; pleasant to hear.",
                example: "\"She spoke with a mellifluous voice that instantly calmed the room.\"",
                synonyms: ["Melodic", "Harmonious", "Silvery"]
            },
            {
                word: "Petrichor",
                phonetic: "/ˈpɛt.rɪ.kɔːr/",
                category: "Nature",
                definition: "A pleasant smell that frequently accompanies the first rain after a long period of warm, dry weather.",
                example: "\"The heavy petrichor filled the air right before the storm broke.\"",
                synonyms: ["Earth scent", "Rain aroma"]
            },
            {
                word: "Resilient",
                phonetic: "/rɪˈzɪl.jənt/",
                category: "Workplace",
                definition: "Able to withstand or recover quickly from difficult conditions.",
                example: "\"Entrepreneurs need to be resilient when facing unexpected hurdles.\"",
                synonyms: ["Tough", "Hardy", "Adaptable"]
            }
        ];

        let currentIndex = 0;
        let savedWords = JSON.parse(localStorage.getItem('lexicon_saved')) || [];
        let streak = parseInt(localStorage.getItem('lexicon_streak')) || 1;

        document.getElementById('streakCount').innerText = streak;

        function displayWord(index) {
            const w = words[index];
            document.getElementById('wordTitle').innerText = w.word;
            document.getElementById('wordPhonetic').innerText = w.phonetic;
            document.getElementById('wordCategory').innerText = w.category;
            document.getElementById('wordDefinition').innerText = w.definition;
            document.getElementById('wordExample').innerText = w.example;
            
            const synContainer = document.getElementById('wordSynonyms');
            synContainer.innerHTML = w.synonyms.map(s => `<span class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded">${s}</span>`).join('');

            updateSaveButtonState();
        }

        function loadNewWord() {
            currentIndex = (currentIndex + 1) % words.length;
            displayWord(currentIndex);
        }

        function speakWord() {
            const w = words[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(w);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSave() {
            const w = words[currentIndex];
            const existsIndex = savedWords.findIndex(item => item.word === w.word);
            
            if (existsIndex > -1) {
                savedWords.splice(existsIndex, 1);
            } else {
                savedWords.push(w);
            }
            
            localStorage.setItem('lexicon_saved', JSON.stringify(savedWords));
            updateSaveButtonState();
            renderSavedList();
        }

        function updateSaveButtonState() {
            const w = words[currentIndex];
            const isSaved = savedWords.some(item => item.word === w.word);
            const btn = document.getElementById('saveBtn');
            btn.innerText = isSaved ? '❤️' : '🤍';
        }

        function renderSavedList() {
            const list = document.getElementById('savedList');
            if (savedWords.length === 0) {
                list.innerHTML = `<p class="text-zinc-500 text-sm text-center py-8">No saved words yet. Tap the heart icon on any word to save it here!</p>`;
                return;
            }
            list.innerHTML = savedWords.map(w => `
                <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-xl flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-white text-sm">${w.word}</h3>
                        <p class="text-xs text-zinc-400 mt-0.5">${w.definition}</p>
                    </div>
                </div>
            `).join('');
        }

        function shareWord() {
            const w = words[currentIndex];
            const text = `Word of the Day: *${w.word}* (${w.phonetic})\nDefinition: ${w.definition}\nExample: ${w.example}`;
            if (navigator.share) {
                navigator.share({ title: 'Lexicon Daily', text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Word copied to clipboard!');
            }
        }

        function switchTab(tab) {
            const homeTab = document.getElementById('tabHome');
            const savedTab = document.getElementById('tabSaved');
            const navHome = document.getElementById('navHome');
            const navSaved = document.getElementById('navSaved');

            if (tab === 'home') {
                homeTab.classList.remove('hidden');
                savedTab.classList.add('hidden');
                navHome.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition";
                navSaved.className = "px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition";
            } else {
                homeTab.classList.add('hidden');
                savedTab.classList.remove('hidden');
                navSaved.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition";
                navHome.className = "px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition";
                renderSavedList();
            }
        }

        displayWord(currentIndex);
    </script>
</body>
</html>
